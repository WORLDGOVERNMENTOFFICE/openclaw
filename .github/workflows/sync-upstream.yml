name: Sync with Upstream

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时执行一次

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          repository: WORLDGOVERNMENTOFFICE/OpenClaw  # 上游仓库的完整名称
          token: ${{ secrets.PAT }}

      - name: Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"

      - name: Pull latest changes
        run: |
          git pull origin main  # 或其他分支名

      - name: Commit and Push
        run: |
          git add .
          git commit -m "Sync with upstream" --allow-empty
          git push https://${{ secrets.PAT }}@github.com/WORLDGOVERNMENTOFFICE/OpenClaw.git main  # 你的 Fork 仓库 URL
