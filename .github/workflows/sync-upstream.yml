name: Sync with Upstream

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Git
      uses: appleboy/setup-ssh-key@master
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Fetch upstream changes
      run: |
        git remote add upstream https://github.com/WORLDGOVERNMENTOFFICE/OpenClaw.git
        git fetch upstream

    - name: Merge upstream changes
      run: |
        git merge upstream/main

    - name: Commit and push changes
      run: |
        git add .
        git commit -m "Sync with upstream" --allow-empty
        git push -u origin main
