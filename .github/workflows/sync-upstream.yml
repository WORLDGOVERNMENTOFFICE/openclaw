name: Sync with Upstream

on:
  workflow_dispatch:
    inputs:
      token:
        required: true
        description: 'The personal access token'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          repository: WORLDGOVERNMENTOFFICE/OpenClaw  # 上游仓库的完整名称
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "Dr.Hengjie Liu Token"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes from upstream
        run: |
          git remote add upstream https://github.com/WORLDGOVERNMENTOFFICE/OpenClaw.git
          git fetch upstream
          git merge upstream/main

      - name: Commit and Push
        run: |
          git add .
          git commit -m "Sync with upstream" --allow-empty
          git push https://john_doe:${{ secrets.GITHUB_TOKEN }}@github.com/john_doe/OpenClaw.git main
